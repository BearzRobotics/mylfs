name: lynx
version: 2.9.3
release: 1
url: https://invisible-mirror.net/archives/lynx/tarballs/lynx2.9.3.tar.bz2
homepage: https://lynx.invisible-island.net/

license: GPL-2.0-or-later
summary: Text-based web browser
description: |
  Lynx is a text-based web browser for use on cursor-addressable character cell terminals.

phase: 5
buildsystem: make
builddeps: [openssl, ncurses]

buildsteps: |
  ./configure --prefix=/usr           \
              --sysconfdir=/etc/lynx  \
              --with-zlib             \
              --with-bzlib            \
              --with-ssl              \
              --with-screen=ncursesw  \
              --enable-ipv6           \
              --enable-locale-charset \
              --enable-nls            \
              --datadir=/usr/share/doc/lynx-{version}
  make

  make install-full
  chgrp -v -R root /usr/share/doc/lynx-{version}/lynx_doc
  sed -e '/#LOCALE/     a LOCALE_CHARSET:TRUE'     -i /etc/lynx/lynx.cfg
  sed -e '/#DEFAULT_ED/ a DEFAULT_EDITOR:vi'       -i /etc/lynx/lynx.cfg
  sed -e '/#PERSIST/    a PERSISTENT_COOKIES:TRUE' -i /etc/lynx/lynx.cfg
  
