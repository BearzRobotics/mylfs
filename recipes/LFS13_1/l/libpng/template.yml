name: libpng
version: 1.6.58
release: 1
url: https://downloads.sourceforge.net/libpng/libpng-1.6.58.tar.xz
homepage: https://downloads.sourceforge.net/libpng/

license: 
summary:  
description: |

phase: 5


builddeps: [make, glibc]

buildsteps: |
    zcat ../patches/libpng-1.6.58-apng.patch.gz | patch -p1


    ./configure --prefix=/usr --disable-static 
    make

    make install
    mkdir -vp /usr/share/doc/libpng-{version}
    cp -vf README libpng-manual.txt /usr/share/doc/libpng-{version}
