name: shadow
version: 4.20.2
release: 1
url: https://github.com/shadow-maint/shadow/releases/download/4.20.2/shadow-4.20.2.tar.xz
homepage: https://github.com/shadow-maint/shadow/

license: BSD-3-Clause
summary: login and password tools
description: |
  Utilities for managing shadow password files and user/group accounts
phase: 4
order: 300
critical: true
builddeps: [ libcap, attr, acl ]

buildsteps: |
  find man -name Makefile.in -exec sed -i 's/getspnam\.3 / /' {} \;
  find man -name Makefile.in -exec sed -i 's/passwd\.5 / /'   {} \;

  sed -e 's:#ENCRYPT_METHOD SHA512:ENCRYPT_METHOD YESCRYPT:' \
      -e 's:/var/spool/mail:/var/mail:'                   \
      -e '/PATH=/{s@/sbin:@@;s@/bin:@@}'                  \
      -i etc/login.defs

  touch /usr/bin/passwd
  ./configure --sysconfdir=/etc   \
              --disable-static    \
              --with-{b,yes}crypt \
              --without-libbsd    \
              --disable-logind    \
              --with-group-name-max-length=32

  make
  make exec_prefix=/usr install
  make -C man install-man

  pwconv
  grpconv

  mkdir -p /etc/default
  useradd -D --gid 999

  echo "root:$ROOT_PASSWD" | chpasswd

