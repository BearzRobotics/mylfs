name: sqlite3
version: 3.53.4
release: 1
url: 
  - https://sqlite.org/2026/sqlite-autoconf-3530400.tar.gz
  - https://sqlite.org/2026/sqlite-doc-3530400.zip
homepage: https://sqlite.org

license: Public-Domain
summary:  Self contained SQL package
description: |
  The SQLite package is a software library that implements a 
  self-contained, serverless, zero-configuration, transactional SQL database engine.
phase: 4
order: 520
critical: true

builddeps: [make, glibc, zlib, readline, libarchive]

buildsteps: |
  unzip -q ../sqlite-doc-3530400.zip
  ./configure --prefix=/usr     \
              --disable-static  \
              --enable-fts{4,5} \
              CPPFLAGS="-D SQLITE_ENABLE_COLUMN_METADATA=1 \
                        -D SQLITE_ENABLE_UNLOCK_NOTIFY=1   \
                        -D SQLITE_ENABLE_DBSTAT_VTAB=1     \
                        -D SQLITE_SECURE_DELETE=1"         
  make LDFLAGS.rpath=""

  make install

  install -v -m755 -d /usr/share/doc/sqlite-3.53.4 
  cp -v -R -f sqlite-doc-3530400/* /usr/share/doc/sqlite-3.53.4