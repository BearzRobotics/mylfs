name: wget
version: 1.25.0
release: 1
url: https://ftpmirror.gnu.org/wget/wget-1.25.0.tar.gz
homepage: https://www.gnu.org/software/wget/

license: GPL-3.0-or-later
summary: Non-interactive network downloader
description: |
  wget is a free utility for non-interactive download of files from the Web.

phase: 5
buildsystem: make
builddeps: [libpsl]

buildsteps: |
  NEW_LINE='#if !defined OPENSSL_NO_SSL3_METHOD '
  NEW_LINE+='&& OPENSSL_VERSION_NUMBER < 0x40000000L'
  sed -i "/SSL3/c $NEW_LINE" src/openssl.c
  unset NEW_LINE

  ./configure --prefix=/usr --sysconfdir=/etc --with-ssl=openssl
  make
  make install
