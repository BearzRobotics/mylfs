name: openssl
version: 4.0.1
release: 1
url: https://github.com/openssl/openssl/releases/download/openssl-4.0.1/openssl-4.0.1.tar.gz
homepage: https://www.openssl-library.org/

license: 
summary: 
description: |

phase: 4
order: 490
critical: true
builddeps: [ perl ]

buildsteps: |
  ./config --prefix=/usr         \
          --openssldir=/etc/ssl \
          --libdir=lib          \
          shared                \
          zlib-dynamic

  make

  if [ "$RUN_TESTS" = "1" ]; then
      set +e
      HARNESS_JOBS=$(nproc) make test
      set -e
  fi

  make INSTALL_LIBS= MANSUFFIX=ssl install

  mv /usr/share/doc/openssl /usr/share/doc/openssl-{version}

  cp -fr doc/* /usr/share/doc/openssl-{version}
