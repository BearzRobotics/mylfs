name: curl
version: 8.21.0
release: 1
url: https://curl.se/download/curl-8.21.0.tar.xz
homepage: https://curl.se/

license: curl
summary: Command line tool and library for transferring data with URLs
description: |
  curl is a command-line tool for transferring data specified with URL syntax. It supports various protocols including HTTP, FTP, and others.

phase: 5
builddeps: [libpsl, libidn2, make, zlib, glibc, makeca_certs, openssl]

buildsteps: |
  ./configure --prefix=/usr    \
              --disable-static \
              --with-openssl   \
              --with-ca-path=/etc/ssl/certs
  make
  make install
  rm -rf docs/examples/.deps
  find docs \( -name Makefile\* -o -name \*.1 -o -name \*.3 -o -name CMakeLists.txt \) -delete
  cp -v -R docs -T /usr/share/doc/curl-{version}
